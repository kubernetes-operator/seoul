apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-cluster-monitor
  namespace: k8s-cluster-monitor
# automountServiceAccountToken intentionally left at the default (true) —
# this pod's entire purpose is to call the Kubernetes API, so the token is
# actually needed, unlike most workloads. The security check module will
# (correctly, and expectedly) flag this SA in its own scan output; that's
# transparency working as intended, not a bug to suppress.
