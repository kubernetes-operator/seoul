apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-cluster-monitor
  namespace: k8s-cluster-monitor
  labels:
    app.kubernetes.io/name: k8s-cluster-monitor
spec:
  # Single replica by design: SQLite is single-writer, and the scheduler/
  # on-demand run endpoint both go through the same in-process registry, so
  # there is no coordination story for multiple replicas yet.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-cluster-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-cluster-monitor
    spec:
      serviceAccountName: k8s-cluster-monitor
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k8s-cluster-monitor
          # Replace <registry> and pin an explicit semantic version — never
          # `:latest` (this cluster's own security audit flagged that
          # antipattern elsewhere; no reason to repeat it here).
          image: registry.local.cloud:5000/k8s-cluster-monitor:v0.1.2
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: k8s-cluster-monitor-config
            - secretRef:
                name: k8s-cluster-monitor-auth
          env:
            - name: MONITOR_DB_PATH
              value: /data/monitor.db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: k8s-cluster-monitor-data
        - name: tmp
          emptyDir: {}
