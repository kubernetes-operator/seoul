# Non-secret configuration only. Service names below match kube-prometheus-stack's
# default Helm release naming ("prometheus-stack") and this cluster's loki-stack
# release, both confirmed against the real cluster during this tool's design —
# verify with `kubectl get svc -n monitoring` / `-n logging` if the Helm release
# names ever change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-cluster-monitor-config
  namespace: k8s-cluster-monitor
data:
  MONITOR_PROMETHEUS_URL: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090"
  MONITOR_ALERTMANAGER_URL: "http://prometheus-stack-kube-prom-alertmanager.monitoring.svc.cluster.local:9093"
  MONITOR_GRAFANA_URL: "http://prometheus-stack-grafana.monitoring.svc.cluster.local:80"
  MONITOR_LOKI_URL: "http://loki-stack.logging.svc.cluster.local:3100"
  MONITOR_HTTP_TIMEOUT_SECONDS: "5.0"
  # Empty = scheduling disabled by default; set via the Settings page in the
  # dashboard (persisted to SQLite) or here (only used the very first boot,
  # before the `schedule` table has a row). Example hourly: "0 * * * *"
  MONITOR_SCHEDULE_CRON: ""
  MONITOR_RETENTION_DAYS: "30"

  # Active load-test feature. Disabled by default even after the code ships —
  # enabling it is a deliberate, separate operator action (flip to "true" +
  # rollout restart). MONITOR_LOADTEST_ALLOWED_NAMESPACES is informational/
  # cross-referenced with backend/app/load_test.py's ALLOWED_TARGETS (the
  # actual enforcement, namespace+service+port) and with 04-networkpolicy.yaml's
  # egress rules — all three must be kept in sync by hand if a target is added.
  MONITOR_LOADTEST_ENABLED: "false"
  MONITOR_LOADTEST_ALLOWED_NAMESPACES: "demo-app,gitea,model-factory,os-monitor"
  MONITOR_LOADTEST_MAX_DURATION_SECONDS: "60"
  MONITOR_LOADTEST_MAX_CONCURRENCY: "50"
  MONITOR_LOADTEST_MAX_TOTAL_REQUESTS: "5000"
