<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>k8s-cluster-monitor</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <h1>k8s-cluster-monitor</h1>
  <nav id="tabs">
    <button data-tab="overview" class="tab active">개요</button>
    <button data-tab="health" class="tab">헬스</button>
    <button data-tab="network" class="tab">네트워크</button>
    <button data-tab="security" class="tab">보안</button>
    <button data-tab="storage_backup" class="tab">스토리지/백업</button>
    <button data-tab="observability" class="tab">관측성</button>
    <button data-tab="chaos" class="tab">제안된 카오스 테스트</button>
    <button data-tab="settings" class="tab">설정</button>
  </nav>
</header>

<main id="app">
  <section id="view-overview" class="view active">
    <div class="toolbar">
      <button id="run-all-btn" class="btn-primary">전체 도메인 지금 실행</button>
      <span id="run-all-status" class="muted"></span>
    </div>
    <div id="overview-cards" class="cards"></div>
    <h2>추세 (findings over time)</h2>
    <div class="toolbar">
      <label>도메인 <select id="trend-domain">
        <option value="">전체</option>
        <option value="health">health</option>
        <option value="network">network</option>
        <option value="security">security</option>
        <option value="storage_backup">storage_backup</option>
        <option value="observability">observability</option>
      </select></label>
      <label>기간 <select id="trend-days">
        <option value="7">7일</option>
        <option value="14" selected>14일</option>
        <option value="30">30일</option>
      </select></label>
    </div>
    <div id="trend-chart" class="chart-box"></div>
  </section>

  <section id="view-health" class="view domain-view" data-domain="health"></section>
  <section id="view-network" class="view domain-view" data-domain="network"></section>
  <section id="view-security" class="view domain-view" data-domain="security"></section>
  <section id="view-storage_backup" class="view domain-view" data-domain="storage_backup"></section>
  <section id="view-observability" class="view domain-view" data-domain="observability"></section>

  <section id="view-chaos" class="view">
    <h2>제안된 카오스/복원력 테스트 (읽기 전용)</h2>
    <p class="muted">
      이 도구는 클러스터 상태를 바꾸는 어떤 버튼도 제공하지 않습니다. 파괴적 테스트는
      <code>k8s-resilience-test</code> 스킬(Claude Code)을 통해 사람이 각 단계마다 직접 승인한 뒤에만 실행하세요.
    </p>
    <table class="findings-table">
      <thead><tr><th>테스트</th><th>대상</th><th>예상 영향</th><th>승인 상태</th></tr></thead>
      <tbody id="chaos-table-body"></tbody>
    </table>
  </section>

  <section id="view-settings" class="view">
    <h2>스케줄 설정</h2>
    <form id="settings-form">
      <label>Cron 표현식 (비우면 스케줄 비활성화)
        <input type="text" id="cron-input" placeholder="0 * * * * (매시 정각)">
      </label>
      <div id="cron-preview" class="muted"></div>
      <fieldset>
        <legend>실행할 도메인</legend>
        <label><input type="checkbox" value="health" class="domain-checkbox" checked> health</label>
        <label><input type="checkbox" value="network" class="domain-checkbox" checked> network</label>
        <label><input type="checkbox" value="security" class="domain-checkbox" checked> security</label>
        <label><input type="checkbox" value="storage_backup" class="domain-checkbox" checked> storage_backup</label>
        <label><input type="checkbox" value="observability" class="domain-checkbox" checked> observability</label>
      </fieldset>
      <button type="submit" class="btn-primary">저장</button>
      <span id="settings-status" class="muted"></span>
    </form>
  </section>
</main>

<script src="/js/charts.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
